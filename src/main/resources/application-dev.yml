spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order-system-bd
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info,caches,httpexchanges
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

jwt:
  # Fallback é APENAS para desenvolvimento local — nunca usar em produção.
  secret: ${JWT_SECRET:m9Qkq8Xl3vJ2p9zRk8k1bQw3d2s9a0LQ0mQk8mZp8vA=}

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
