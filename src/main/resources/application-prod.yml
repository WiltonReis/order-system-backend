spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  address: 0.0.0.0

app:
  r2:
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    public-url: ${R2_PUBLIC_URL}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.ordersystem: WARN