oms:
  env: prod

loki:
  url: ${LOKI_URL}
  user: ${LOKI_USER}
  password: ${LOKI_PASSWORD}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

app:
  r2:
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    public-url: ${R2_PUBLIC_URL}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    metrics:
      export:
        url: ${OTLP_METRICS_URL}
        headers:
          Authorization: "Basic ${OTLP_METRICS_AUTH_BASE64}"
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT}
      headers:
        Authorization: "Basic ${OTLP_TRACES_AUTH_BASE64}"
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

jwt:
  secret: ${JWT_SECRET}
